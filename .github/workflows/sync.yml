name: Daily sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Assembly data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        id: sync
        continue-on-error: true
        run: npm run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Steps that succeeded have already written their data, so deploy even if another step failed.
      - name: Trigger deploy
        if: steps.sync.outcome != 'cancelled'
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 -X POST \
            -H "Authorization: token ${{ secrets.WORKFLOW_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/NickShaw1/stormont-watch/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Fail the run if any sync step failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::One or more sync steps failed. Data from the other steps was still deployed."
          exit 1
